services:
  api-single:
    build: ./api
    volumes:
      - ./files:/app/files
    networks:
      - app-net

  api-2:
    build: ./api
    volumes:
      - ./files:/app/files
    networks:
      - app-net

  api-3:
    build: ./api
    volumes:
      - ./files:/app/files
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-single
      - api-2
      - api-3
    networks:
      - app-net

  locust:
    build: ./loadtest
    ports:
      - "8089:8089"
    volumes:
      - ./loadtest/results:/app/results
    environment:
      - LOCUST_HOST=http://nginx:80
    depends_on:
      - nginx
    networks:
      - app-net

networks:
  app-net:
