name: api-bench-s2

services:
  api-single:
    build: ./api
    volumes:
      - ./files:/files
    networks:
      - app-net

  api-2:
    build: ./api
    volumes:
      - ./files:/files
    networks:
      - app-net

  api-3:
    build: ./api
    volumes:
      - ./files:/files
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-single
      - api-2
      - api-3
    networks:
      - app-net

  locust:
    build: ./loadtest
    volumes:
      - ./loadtest/results:/app/results
    environment:
      LOCUST_HOST: ${LOCUST_HOST:-http://nginx:80}
      LOCUST_USERS_LIST: ${LOCUST_USERS_LIST:-100,1000,10000}
      LOCUST_RUN_TIME: ${LOCUST_RUN_TIME:-5m}
      LOCUST_SPAWN_RATE: ${LOCUST_SPAWN_RATE:-auto}
      LOCUST_MAX_ERROR_PCT: ${LOCUST_MAX_ERROR_PCT:-10}
      LOCUST_MAX_P95_S: ${LOCUST_MAX_P95_S:-60}
      SCENARIO_PREFIX: ${SCENARIO_PREFIX:-s2}
    depends_on:
      - nginx
    networks:
      - app-net

networks:
  app-net:

