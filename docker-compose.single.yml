name: api-bench-s1

services:
  api-single:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./files:/files
    networks:
      - app-net

  locust:
    build: ./loadtest
    volumes:
      - ./loadtest/results:/app/results
    environment:
      LOCUST_HOST: ${LOCUST_HOST:-http://api-single:8000}
      LOCUST_USERS_LIST: ${LOCUST_USERS_LIST:-100,1000,10000}
      LOCUST_RUN_TIME: ${LOCUST_RUN_TIME:-5m}
      LOCUST_SPAWN_RATE: ${LOCUST_SPAWN_RATE:-auto}
      LOCUST_MAX_ERROR_PCT: ${LOCUST_MAX_ERROR_PCT:-10}
      LOCUST_MAX_P99_S: ${LOCUST_MAX_P99_S:-60}
      SCENARIO_PREFIX: ${SCENARIO_PREFIX:-s1}
    depends_on:
      - api-single
    networks:
      - app-net

networks:
  app-net:

